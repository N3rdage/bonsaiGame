<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3b5d3a" />
    <meta
      name="description"
      content="A cozy bonsai-growing sim. Take cuttings, pot them, train them, and watch them take shape."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Bonsai Greenhouse</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1d2a1c;
        overflow: hidden;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #game canvas {
        display: block;
        image-rendering: pixelated;
      }
      #viewer {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: none;
        touch-action: none;
        z-index: 10;
      }
      #viewer.open {
        display: block;
      }
      #viewer-close {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 11;
        display: none;
        font: 14px monospace;
        color: #d8e6c8;
        background: #2b3a2a;
        border: 1px solid #6e8463;
        padding: 6px 12px;
        cursor: pointer;
      }
      #viewer-close.open {
        display: block;
      }
      #viewer-hotspots {
        position: fixed;
        inset: 0;
        z-index: 11;
        display: none;
        pointer-events: none;
      }
      #viewer-hotspots.open {
        display: block;
      }
      #viewer-hotspots .hotspot {
        position: absolute;
        transform: translate(-50%, -50%);
        box-sizing: border-box;
        width: var(--hotspot-size);
        height: var(--hotspot-size);
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: visible;
        border: 1px solid #fff;
        border-radius: 50%;
        background: var(--hotspot-fill);
        color: #fff;
        font: 10px monospace;
        line-height: 1;
        white-space: nowrap;
        pointer-events: auto;
        cursor: pointer;
      }
      #viewer-hotspots .hotspot:hover {
        width: var(--hotspot-size-hover);
        height: var(--hotspot-size-hover);
        background: var(--hotspot-fill-hover);
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
