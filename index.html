<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3b5d3a" />
    <meta
      name="description"
      content="A cozy bonsai-growing sim. Take cuttings, pot them, train them, and watch them take shape."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Bonsai Greenhouse</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1d2a1c;
        overflow: hidden;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #game canvas {
        display: block;
        image-rendering: pixelated;
      }
      #viewer {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: none;
        touch-action: none;
        z-index: 10;
      }
      #viewer.open {
        display: block;
      }
      /* Toolbar sizes and colours are custom properties set from src/viewer/toolbar.ts. */
      #viewer-toolbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 12;
        display: none;
        box-sizing: border-box;
        min-height: var(--tb-height);
        padding: var(--tb-info-top) var(--tb-exit-right) 0 var(--tb-info-left);
        background: var(--tb-bg);
        color: var(--tb-text);
        font: 14px monospace;
        pointer-events: auto;
      }
      #viewer-toolbar.open {
        display: block;
      }
      #viewer-toolbar .toolbar-row {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        column-gap: var(--tb-exit-gap);
        row-gap: var(--tb-mode-gap);
      }
      #viewer-toolbar .info {
        margin-right: auto;
        line-height: var(--tb-info-line);
        white-space: pre;
      }
      #viewer-toolbar .modes {
        display: flex;
        flex-wrap: wrap;
        gap: var(--tb-mode-gap);
        margin-top: var(--tb-button-offset);
      }
      #viewer-toolbar button,
      #viewer-modal button {
        box-sizing: border-box;
        padding: 0;
        border: 1px solid var(--tb-border);
        font: inherit;
        cursor: pointer;
      }
      #viewer-toolbar .ui-button,
      #viewer-modal .ui-button {
        height: var(--tb-button-height);
        background: var(--tb-fill);
        color: var(--tb-text);
      }
      #viewer-toolbar .ui-button:hover,
      #viewer-modal .ui-button:hover,
      #viewer-toolbar .ui-toggle.selected:hover {
        background: var(--tb-fill-hover);
      }
      #viewer-toolbar .mode {
        width: var(--tb-mode-width);
      }
      #viewer-toolbar .mode.selected {
        outline: var(--tb-selected-width) solid var(--tb-selected);
      }
      #viewer-toolbar .exit {
        width: var(--tb-exit-width);
        margin-top: var(--tb-button-offset);
      }
      #viewer-toolbar .sub-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        column-gap: var(--tb-subrow-separator);
        row-gap: var(--tb-subrow-gap);
        margin: var(--tb-subrow-offset) calc(-1 * var(--tb-exit-right)) 0
          calc(-1 * var(--tb-info-left));
      }
      #viewer-toolbar .group {
        display: flex;
        align-items: center;
        gap: var(--tb-subrow-gap);
      }
      #viewer-toolbar .label {
        display: flex;
        justify-content: flex-end;
        width: var(--tb-label-width);
        color: var(--tb-label);
        white-space: nowrap;
      }
      #viewer-toolbar .ui-toggle {
        height: var(--tb-subrow-height);
        background: transparent;
        color: var(--tb-toggle-text);
      }
      #viewer-toolbar .ui-toggle:hover {
        background: var(--tb-toggle-hover);
      }
      #viewer-toolbar .ui-toggle.selected {
        background: var(--tb-fill);
        color: var(--tb-text);
      }
      #viewer-help {
        position: fixed;
        left: 0;
        right: 0;
        bottom: var(--tb-help-bottom);
        z-index: 11;
        display: none;
        flex-direction: column;
        align-items: center;
        padding: 0 8px;
        color: var(--tb-label);
        font: 14px monospace;
        line-height: var(--tb-help-line);
        text-align: center;
        white-space: pre-wrap;
        pointer-events: none;
      }
      #viewer-help.open {
        display: flex;
      }
      #viewer-hotspots {
        position: fixed;
        inset: 0;
        z-index: 11;
        display: none;
        pointer-events: none;
      }
      #viewer-hotspots.open {
        display: block;
      }
      #viewer-hotspots .hotspot {
        position: absolute;
        transform: translate(-50%, -50%);
        box-sizing: border-box;
        width: var(--hotspot-size);
        height: var(--hotspot-size);
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: visible;
        border: 1px solid #fff;
        border-radius: 50%;
        background: var(--hotspot-fill);
        color: #fff;
        font: 10px monospace;
        line-height: 1;
        white-space: nowrap;
        pointer-events: auto;
        cursor: pointer;
      }
      #viewer-hotspots .hotspot:hover {
        width: var(--hotspot-size-hover);
        height: var(--hotspot-size-hover);
        background: var(--hotspot-fill-hover);
      }
      /* The hover and click circle: the prototype's 16 px hit radius round the centre. */
      #viewer-hotspots .hotspot::before {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: var(--hotspot-hit-size);
        height: var(--hotspot-hit-size);
        transform: translate(-50%, -50%);
        border-radius: 50%;
      }
      /* Below the circle and click-through, so the button's hit area stays the hit circle. */
      #viewer-hotspots .caption {
        position: absolute;
        top: calc(100% + var(--hotspot-caption-gap));
        left: 50%;
        transform: translateX(-50%);
        pointer-events: none;
      }
      /* The wire-removal confirmation; sizes and colours set from src/viewer/modal.ts.
       * The dim covers the viewport and takes every pointer event, so nothing beneath reacts. */
      #viewer-modal {
        position: fixed;
        inset: 0;
        z-index: 13;
        display: none;
        background: var(--modal-dim);
        font: 14px monospace;
        touch-action: none;
      }
      #viewer-modal.open {
        display: block;
      }
      #viewer-modal .box {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        box-sizing: border-box;
        width: min(var(--modal-width), 100%);
        height: var(--modal-height);
        border: 1px solid var(--modal-border);
        background: var(--modal-fill);
        text-align: center;
      }
      #viewer-modal .title {
        position: absolute;
        top: var(--modal-title-top);
        left: 0;
        right: 0;
        color: var(--modal-title);
      }
      #viewer-modal .detail {
        position: absolute;
        top: var(--modal-detail-top);
        left: 0;
        right: 0;
        color: var(--modal-detail);
        line-height: var(--tb-info-line);
      }
      #viewer-modal .buttons {
        position: absolute;
        bottom: var(--modal-button-bottom);
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: var(--modal-button-gap);
      }
      #viewer-modal .ui-button {
        width: var(--modal-button-width);
        height: var(--modal-button-height);
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
