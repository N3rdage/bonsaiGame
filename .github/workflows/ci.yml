name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Three stages. `static` lints, typechecks, runs the unit tests and builds once. `e2e` runs the
# browser suite against that one build, split across runners because it is the slow part: every
# walk is paced by real frames on software GL, and the suite runs once on desktop and again by
# touch on a phone. `checks` is the single required check; it passes only when both passed.
# Tests tagged @walk are left out here and run on main from walk-tests.yml instead.
jobs:
  static:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test -- --coverage

      - name: Build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: Browser tests (${{ matrix.name }})
    needs: static
    runs-on: ubuntu-latest
    # A slice takes a few minutes; the limit leaves room for a slow runner without hiding a hang.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chromium 1 of 2
            args: --project=chromium --shard=1/2
          - name: chromium 2 of 2
            args: --project=chromium --shard=2/2
          - name: s22-landscape 1 of 3
            args: --project=s22-landscape --shard=1/3
          - name: s22-landscape 2 of 3
            args: --project=s22-landscape --shard=2/3
          - name: s22-landscape 3 of 3
            args: --project=s22-landscape --shard=3/3
          # The two portrait projects run only the rotate prompt's tests.
          - name: portrait
            args: --project=mobile --project=s22-portrait
          # The whole loop in one long test. --no-deps: the config makes it wait for the other
          # four projects so it never shares a machine with them; here it has its own.
          - name: parity
            args: --project=s22-landscape-parity --no-deps
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Fetch the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        env:
          E2E_ARGS: ${{ matrix.args }}
        # Unquoted on purpose: the value is this file's own matrix entry, several arguments.
        # Tests tagged @walk (long real-time walks) run in walk-tests.yml on a schedule, not here.
        run: npm run test:e2e -- $E2E_ARGS --grep-invert @walk

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 7

  checks:
    # The required check: its name must not change without changing the ruleset.
    name: Lint, typecheck, test, build, e2e
    needs: [static, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every stage passed
        env:
          STATIC: ${{ needs.static.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "static: $STATIC, e2e: $E2E"
          [ "$STATIC" = "success" ] && [ "$E2E" = "success" ]
