name: Gitleaks

on:
  pull_request:
  push:
    branches: [main]

# Explicit token scope (security sweep BG-007): read the code, and write to pull requests so
# the action can summarise findings there. Nothing else, whatever the repository default is.
permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
