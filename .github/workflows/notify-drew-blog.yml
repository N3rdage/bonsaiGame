name: Notify drew-blog of blog changes

on:
  push:
    branches: [main]
    paths: ['blog/**']

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    # The dispatch token lives in the `production` environment, whose deployment branches are
    # limited to `main`, so a workflow on any other branch cannot read it (security audit 2026-11-14).
    environment: production
    steps:
      - name: Send repository_dispatch to drew-blog
        env:
          TOKEN: ${{ secrets.DREW_BLOG_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "DREW_BLOG_DISPATCH_TOKEN not set — skipping dispatch (sync cron will pick changes up)."
            exit 0
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/N3rdage/drew-blog/dispatches \
            -d '{"event_type":"blog-sync","client_payload":{"source":"bonsaiGame"}}'
