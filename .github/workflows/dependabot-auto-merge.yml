# Keeps development tooling current without a human in the loop for the routine cases.
# Dependabot opens the PR, CI runs, and if the update is a minor or patch bump of the
# `dev-tooling` group (development dependencies, see .github/dependabot.yml) this approves it
# and enables auto-merge; GitHub merges once every required check is green.
# Everything else waits for Drew (security sweep BG-014, option B): the `runtime-minor` group,
# because those packages ship to players and a merge to main deploys; GitHub Actions bumps,
# because they change what CI runs; and any update outside a group. Major bumps are left for a
# person (or the orchestrator's `decision` issue), because they are the ones that break things.
# The approval is for Dependabot's own work only: a PR that carries any commit Dependabot did not
# write and sign (a fix pushed to its branch, a branch update) is not approved here and waits for
# a person. To bring a Dependabot PR up to date, ask Dependabot to rebase it.
# Requires "Allow auto-merge" in the repository settings.
name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read update metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Count commits that are not Dependabot's own
        id: commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Dependabot's commits are authored by its account and signed by GitHub. A commit that
          # only copies its name and email is not signed, so it counts as someone else's.
          foreign=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/commits" \
            --jq '[.[] | select(.author.login != "dependabot[bot]" or .commit.verification.verified != true)] | length' \
            | awk '{ n += $1 } END { print n + 0 }')
          echo "Commits not written and signed by Dependabot: $foreign"
          echo "foreign=$foreign" >> "$GITHUB_OUTPUT"

      - name: Leave a PR that carries someone else's commits for a person
        if: steps.commits.outputs.foreign != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          FOREIGN: ${{ steps.commits.outputs.foreign }}
        run: |
          gh pr merge --disable-auto "$PR_URL" || true
          gh pr comment "$PR_URL" --body "Not auto-approved: this PR carries $FOREIGN commit(s) that Dependabot did not write and sign. It waits for Drew. To bring a Dependabot PR up to date without this, ask Dependabot to rebase it."

      - name: Approve and enable auto-merge (dev-tooling group, minor and patch only)
        if: steps.commits.outputs.foreign == '0' && steps.meta.outputs.dependency-group == 'dev-tooling' && (steps.meta.outputs.update-type == 'version-update:semver-minor' || steps.meta.outputs.update-type == 'version-update:semver-patch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          # Passed through env, never interpolated into the script: a dependency name is untrusted text.
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEP_NAMES: ${{ steps.meta.outputs.dependency-names }}
        run: |
          gh pr review --approve "$PR_URL" --body "Auto-approved: $UPDATE_TYPE update of $DEP_NAMES."
          gh pr merge --auto --squash "$PR_URL"

      - name: Leave everything else that is minor or patch for Drew
        if: steps.meta.outputs.dependency-group != 'dev-tooling' && (steps.meta.outputs.update-type == 'version-update:semver-minor' || steps.meta.outputs.update-type == 'version-update:semver-patch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          DEP_NAMES: ${{ steps.meta.outputs.dependency-names }}
        run: |
          gh pr comment "$PR_URL" --body "Update of $DEP_NAMES is not auto-merged: only the dev-tooling group is. This one waits for Drew."

      - name: Leave majors for a person
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          DEP_NAMES: ${{ steps.meta.outputs.dependency-names }}
        run: |
          gh pr comment "$PR_URL" --body "Major update of $DEP_NAMES is not auto-merged. The orchestrator will assess it and open a decision issue if it needs one."
